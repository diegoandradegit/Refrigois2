[build]
  command = "npm run build"
  publish = "dist"

# Arquivos com hash no nome nunca mudam de conteudo: cache longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pagina unica: qualquer caminho cai na landing.
# HTTPS obrigatorio.
#
# O painel do Netlify nao mostrou a chave "Force HTTPS" nesta conta, entao o
# redirecionamento vai aqui, no codigo. Sem ele a pagina continua respondendo em
# http, e o navegador mostra o aviso de site nao seguro — justamente na pagina
# que pede telefone e e-mail de quem esta pedindo orcamento.
#
# force = true para valer antes de qualquer outra regra.
[[redirects]]
  from = "http://camara-fria.refrigois.com.br/*"
  to = "https://camara-fria.refrigois.com.br/:splat"
  status = 301
  force = true

# Paginas legais em endereco limpo, sem a extensao .html.
[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

# Pagina unica: qualquer outro caminho cai na landing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
