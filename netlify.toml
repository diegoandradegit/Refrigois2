[build]
  command = "npm run build"
  publish = "dist"

# Arquivos com hash no nome nunca mudam de conteudo: cache longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pagina unica: qualquer caminho cai na landing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
